<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezyRetire favicon visual fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }

      main {
        display: grid;
        grid-template-columns: repeat(2, 180px);
        gap: 16px;
        padding: 16px;
        width: max-content;
      }

      .chrome {
        display: grid;
        gap: 16px;
        padding: 20px;
        border-radius: 8px;
      }

      .chrome--light {
        background: #f1f3f4;
      }

      .chrome--dark {
        background: #202124;
      }

      .sample {
        display: grid;
        grid-template-columns: 48px 1fr;
        align-items: center;
        min-height: 48px;
      }

      .icon-well {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
      }

      img {
        display: block;
        object-fit: contain;
      }

      .icon--16 {
        width: 16px;
        height: 16px;
      }

      .icon--32 {
        width: 32px;
        height: 32px;
      }

      .label {
        font-size: 12px;
        line-height: 1;
      }

      .chrome--light .label {
        color: #202124;
      }

      .chrome--dark .label {
        color: #f1f3f4;
      }
    </style>
  </head>
  <body>
    <main aria-label="Favicon visual regression fixture">
      <section class="chrome chrome--light" aria-label="Light browser chrome">
        <div class="sample">
          <div class="icon-well">
            <img class="icon--16" src="/favicon.svg" alt="" />
          </div>
          <span class="label">16px tab</span>
        </div>
        <div class="sample">
          <div class="icon-well">
            <img class="icon--32" src="/favicon-32x32.png" alt="" />
          </div>
          <span class="label">32px bookmark</span>
        </div>
      </section>

      <section class="chrome chrome--dark" aria-label="Dark browser chrome">
        <div class="sample">
          <div class="icon-well">
            <img class="icon--16" src="/favicon.svg" alt="" />
          </div>
          <span class="label">16px tab</span>
        </div>
        <div class="sample">
          <div class="icon-well">
            <img class="icon--32" src="/favicon-32x32.png" alt="" />
          </div>
          <span class="label">32px bookmark</span>
        </div>
      </section>
    </main>
  </body>
</html>
